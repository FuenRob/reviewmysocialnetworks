name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go
        run: go test ./...

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Build backend
        run: |
          mkdir -p build/web
          cp -a web/dist build/web/dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
            -o build/reviewmysocialnetworks ./cmd/server

          tar -czf release.tgz -C build .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewmysocialnetworks-release
          path: release.tgz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: reviewmysocialnetworks-release

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          python <<'PY' > ~/.ssh/deploy_key
          import os

          key = os.environ["VPS_SSH_KEY"]
          key = key.lstrip("\ufeff").strip()
          if len(key) >= 2 and key[0] == key[-1] and key[0] in "'\"":
              key = key[1:-1]
          key = key.replace("\\r\\n", "\n").replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          if not key.endswith("\n"):
              key += "\n"
          print(key, end="")
          PY
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          scp \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            -P "${VPS_PORT:-22}" \
            release.tgz \
            "${VPS_USER}@${VPS_HOST}:/tmp/rmsn-${RELEASE_ID}.tgz"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key \
            -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            bash -s -- \
            "$RELEASE_ID" \
            "/tmp/rmsn-${RELEASE_ID}.tgz" <<'REMOTE'
          set -Eeuo pipefail

          RELEASE_ID="$1"
          ARCHIVE="$2"
          APP_ROOT="/var/www/reviewmysocialnetworks"
          RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"

          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"

          test -x "$RELEASE_DIR/reviewmysocialnetworks"
          test -f "$RELEASE_DIR/web/dist/index.html"

          rm -f "$APP_ROOT/current.next"
          ln -s "$RELEASE_DIR" "$APP_ROOT/current.next"
          mv -Tf "$APP_ROOT/current.next" "$APP_ROOT/current"

          sudo -n systemctl restart reviewmysocialnetworks
          sudo -n systemctl is-active --quiet reviewmysocialnetworks

          curl --fail --silent \
            http://127.0.0.1:8080/api/health > /dev/null

          rm -f "$ARCHIVE"

          find "$APP_ROOT/releases" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' |
            sort -nr |
            tail -n +6 |
            cut -d' ' -f2- |
            while IFS= read -r old_release; do
              rm -rf -- "$old_release"
            done
          REMOTE
